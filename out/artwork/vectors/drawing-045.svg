<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 502" role="img" aria-label="Анастасия Доронина за столиком в кафе" style="color:#718591;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round">
          <defs>
