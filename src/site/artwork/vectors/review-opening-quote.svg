<svg xmlns="http://www.w3.org/2000/svg" width="64" height="48" viewBox="0 0 64 48">
  <defs>
    <filter id="dry-chalk" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency=".14" numOctaves="2" seed="8" result="edge"/>
      <feDisplacementMap in="SourceGraphic" in2="edge" scale=".65" xChannelSelector="R" yChannelSelector="G" result="gesture"/>
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="17" result="grain"/>
      <feColorMatrix in="grain" type="luminanceToAlpha" result="powder"/>
      <feComponentTransfer in="powder" result="dry"><feFuncA type="linear" slope="2.8" intercept="-.45"/></feComponentTransfer>
      <feComposite in="gesture" in2="dry" operator="in"/>
    </filter>
  </defs>
  <g fill="none" stroke="#526c73" stroke-linecap="round" stroke-linejoin="round" filter="url(#dry-chalk)">
    <!-- Separate chalk gestures: unequal curls, soft ends and a heavier lower pass. -->
    <path stroke-width="5" d="M25.4 7.5C17.6 10.3 8.6 18.3 8.9 27.6C9 33.2 12.7 37.8 18 36.6C23.6 35.3 24.5 29.1 21 26.6C18.6 24.9 14.3 25.7 12.3 28.6"/>
    <path stroke-width="6.2" opacity=".83" d="M9.2 27.7C9.2 33.8 13.2 37.6 18.2 36.4C23 35.3 24.3 29.7 20.6 27.1"/>
    <path stroke-width="5.6" d="M55.5 9.7C47.4 12 38.3 21 38.9 29.3C39.3 35.6 42.6 39.3 47.6 37.7C52.7 36.1 53.2 30.3 49.6 28C46.7 26.1 43.4 28.2 42.5 30.8"/>
  </g>
</svg>
